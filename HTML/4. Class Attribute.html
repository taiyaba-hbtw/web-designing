<!DOCTYPE html>
<html>

<head>
    <style>
        .city {
            background-color: rgb(12, 34, 156);
            color: rgb(130, 221, 217);
            border: 2px solid rgb(146, 152, 207);
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="city">
        <h2>London</h2>
        <p>London is the capital of England.</p>
    </div>

    <div class="city">
        <h2>Paris</h2>
        <p>Paris is the capital of France.</p>
    </div>

    <div class="city">
        <h2>Tokyo</h2>
        <p>Tokyo is the capital of Japan.</p>
    </div>

</body>

</html>

example2 of a class attribute with multiple elements :
<!DOCTYPE html>
<html>

<head>
    <style>
        .note {
            font-size: 120%;
            color: red;
        }
    </style>
</head>

<body>

    <h1>My <span class="note">Important</span> Heading</h1>
    <p>This is some <span class="note">important</span> text.</p>

</body>

</html>
